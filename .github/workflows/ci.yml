name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  nse-integration:
    name: Nmap NSE integration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Nmap and Benmap
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nmap
          python -m pip install --disable-pip-version-check -e .
      - name: Probe deterministic localhost HTTP service
        shell: bash
        run: |
          set -euo pipefail
          python tests/integration/http_fixture_server.py --port 8080 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          nmap \
            -Pn \
            -sT \
            -sV \
            --version-light \
            --script-timeout 20s \
            --host-timeout 45s \
            -p 8080 \
            --script ./nse/benmap-http.nse \
            --script-args 'benmap-http.method=GET,benmap-http.fallback-get=false' \
            -oX /tmp/benmap.xml \
            127.0.0.1

          python tests/integration/assert_nmap_xml.py /tmp/benmap.xml --port 8080
